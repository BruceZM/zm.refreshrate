<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Refresh Rate Animation</title>
  <style>
    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f8fb;
    }

    .container {
      width: min(100%, 500px);
      margin: 0 auto;
    }

    .box {
      position: relative;
      height: 200px;
      margin-bottom: 20px;
      overflow: hidden;
      border: 1px solid #111827;
      border-radius: 8px;
    }

    #box1 {
      background-color: lightblue;
    }

    #box2 {
      background-color: lightgreen;
    }

    #box3 {
      background-color: rgb(233, 144, 238);
    }

    .ball {
      position: absolute;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: white;
      box-shadow: 0 2px 8px rgb(0 0 0 / 20%);
      will-change: transform;
    }
  </style>
</head>
<body>
  <main class="container" aria-label="Refresh rate animation demo">
    <div id="box1" class="box"><div id="ball1" class="ball"></div></div>
    <div id="box2" class="box"><div id="ball2" class="ball"></div></div>
    <div id="box3" class="box"><div id="ball3" class="ball"></div></div>
  </main>

  <script>
    const animations = [
      { ball: document.getElementById("ball1"), box: document.getElementById("box1"), velocity: { x: 120, y: 120 } },
      { ball: document.getElementById("ball2"), box: document.getElementById("box2"), velocity: { x: 170, y: 170 } },
      { ball: document.getElementById("ball3"), box: document.getElementById("box3"), velocity: { x: 255, y: 255 } },
    ].map((animation) => ({ ...animation, position: { x: 0, y: 0 } }));

    let lastTimestamp;

    function updateAnimation(animation, elapsedSeconds) {
      const { ball, box, position, velocity } = animation;
      const maxX = box.clientWidth - ball.offsetWidth;
      const maxY = box.clientHeight - ball.offsetHeight;

      position.x += velocity.x * elapsedSeconds;
      position.y += velocity.y * elapsedSeconds;

      if (position.x <= 0 || position.x >= maxX) {
        position.x = Math.min(Math.max(position.x, 0), maxX);
        velocity.x *= -1;
      }

      if (position.y <= 0 || position.y >= maxY) {
        position.y = Math.min(Math.max(position.y, 0), maxY);
        velocity.y *= -1;
      }

      ball.style.transform = `translate(${position.x}px, ${position.y}px)`;
    }

    function animate(timestamp) {
      if (lastTimestamp === undefined) {
        lastTimestamp = timestamp;
      }

      // Cap long pauses (for example, after a background tab resumes) to avoid jumps.
      const elapsedSeconds = Math.min((timestamp - lastTimestamp) / 1000, 0.05);
      lastTimestamp = timestamp;

      animations.forEach((animation) => updateAnimation(animation, elapsedSeconds));
      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
